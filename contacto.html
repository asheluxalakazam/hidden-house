<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Hidden House</title>

  <!-- Tipografías -->
  <link href="https://fonts.googleapis.com/css2?family=Mr+Dafoe&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Estilos internos -->
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Open Sans', sans-serif;
    }

    h1 {
      font-family: 'Mr Dafoe', cursive;
      color: #d06c4b;
      font-size: 3rem;
    }

    .contact-wrapper {
      background-color: #111;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 0 20px rgba(255, 136, 0, 0.2);
      max-width: 800px;
      margin: auto;
    }

    label {
      color: #fff;
      font-weight: 600;
    }

    .form-control {
      background-color: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 10px;
    }

    .form-control:focus {
      border-color: #e67e52;
      box-shadow: 0 0 5px #eb9c41;
    }

    .btn-contacto {
      background-color: #bd7c4e;
      border: none;
      color: #fff;
      padding: 10px 30px;
      border-radius: 30px;
      transition: 0.3s;
    }

    .btn-contacto:hover {
      background-color: #ea6f0a;
    }

    .contact-section {
      padding: 80px 20px;
    }

    footer {
      background-color: #111;
      color: #fff;
      text-align: center;
      padding: 20px 0;
    }


    /* Navbar coherente */
    .navbar {
      background-color: #111 ;
    }


    .navbar-brand {
      font-family: 'Mr Dafoe', cursive;
      font-size: 2rem;
      color: #e36b4e !important;
      margin: 0 auto;
    }

    .nav-link {
      color: #fff !important;
    }

    .nav-link:hover {
      color: #ea9b6a !important;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">Hidden House</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="habitaciones.html">Habitaciones</a></li>
          <li class="nav-item"><a class="nav-link active" href="servicios.html">Servicios</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          <li class="nav-item"><a class="nav-link active" href="about.html">Sobre Nosotros</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- SECCIÓN DE CONTACTO -->
  <section class="contact-section">
    <div class="container text-center">
      <h1 class="mb-4">Conéctate con Hidden House</h1>
      <p class="mb-5">¿Tienes dudas, quieres reservar o simplemente saludarnos?<br>Escríbenos y te responderemos lo más pronto posible.</p>

      <div class="contact-wrapper">
        <form>
          <div class="mb-3">
            <label for="nombre">Nombre</label>
            <input type="text" class="form-control" id="nombre" required>
          </div>
          <div class="mb-3">
            <label for="email">Correo electrónico</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="mb-3">
            <label for="mensaje">Mensaje</label>
            <textarea class="form-control" id="mensaje" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn btn-contacto mt-3">Enviar mensaje</button>
        </form>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2025 Hidden House Hostel - Montañita, Ecuador</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
